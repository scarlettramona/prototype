<app-page [showBreadcrumbs]="true">
  <h1 pageTitle>Overlays</h1>
  <p pageDescription>Dialog and snack-bar for visual reference only.</p>

  <section class="showcase-section">
    <h2 class="showcase-section__title">Dialog</h2>
    <button matButton type="button" (click)="openDialog()">Launch dialog</button>
  </section>

  <section class="showcase-section">
    <h2 class="showcase-section__title">Snack-bar</h2>
    <div class="showcase-row">
      <mat-form-field>
        <mat-label>Message</mat-label>
        <input #message matInput value="Disco party!" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Action</mat-label>
        <input #action matInput value="Dance" />
      </mat-form-field>
      <button matButton="outlined" type="button" (click)="openSnackBar(message.value, action.value)">
        Show snack-bar
      </button>
    </div>
  </section>
</app-page>
