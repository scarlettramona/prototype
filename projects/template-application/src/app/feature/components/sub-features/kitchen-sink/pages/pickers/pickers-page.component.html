<app-page [showBreadcrumbs]="true">
  <h1 pageTitle>Pickers</h1>
  <p pageDescription>Date and time pickers for visual reference only.</p>

  <section class="showcase-section">
    <h2 class="showcase-section__title">Datepicker</h2>
    <mat-form-field>
      <mat-label>Choose a date</mat-label>
      <input matInput [matDatepicker]="picker" />
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker" />
      <mat-datepicker #picker />
    </mat-form-field>
  </section>

  <section class="showcase-section">
    <h2 class="showcase-section__title">Timepicker</h2>
    <mat-form-field>
      <mat-label>Pick a time</mat-label>
      <input matInput [matTimepicker]="timePicker" />
      <mat-timepicker-toggle matIconSuffix [for]="timePicker" />
      <mat-timepicker #timePicker />
    </mat-form-field>
  </section>
</app-page>
