<section>
  <div class="example-label">Text</div>
  <div class="example-button-row">
    <button matButton type="button">Basic</button>
    <button disabled matButton type="button">Disabled</button>
    <a href="https://www.google.com/" matButton target="_blank">Link</a>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Elevated</div>
  <div class="example-button-row">
    <button matButton="elevated" type="button">Basic</button>
    <button disabled matButton="elevated" type="button">Disabled</button>
    <a href="https://www.google.com/" matButton="elevated" target="_blank">Link</a>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Outlined</div>
  <div class="example-button-row">
    <button matButton="outlined" type="button">Basic</button>
    <button disabled matButton="outlined" type="button">Disabled</button>
    <a href="https://www.google.com/" matButton="outlined" target="_blank">Link</a>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Filled</div>
  <div class="example-button-row">
    <button matButton="filled" type="button">Basic</button>
    <button disabled matButton="filled" type="button">Disabled</button>
    <a href="https://www.google.com/" matButton="filled" target="_blank">Link</a>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Tonal</div>
  <div class="example-button-row">
    <button matButton="tonal" type="button">Basic</button>
    <button disabled matButton="tonal" type="button">Disabled</button>
    <a href="https://www.google.com/" matButton="tonal" target="_blank">Link</a>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Icon</div>
  <div class="example-button-row">
    <div class="example-flex-container">
      <button aria-label="Example icon button with a vertical three dot icon" matIconButton type="button">
        <mat-icon class="material-symbols-rounded">more_vert</mat-icon>
      </button>
      <button aria-label="Example icon button with a open in new tab icon" disabled matIconButton type="button">
        <mat-icon class="material-symbols-rounded">open_in_new</mat-icon>
      </button>
    </div>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Floating Action Button (FAB)</div>
  <div class="example-button-row">
    <div class="example-flex-container">
      <button aria-label="Example icon button with a delete icon" matFab type="button">
        <mat-icon class="material-symbols-rounded">delete</mat-icon>
      </button>
      <button aria-label="Example icon button with a heart icon" disabled matFab type="button">
        <mat-icon class="material-symbols-rounded">favorite</mat-icon>
      </button>
    </div>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Mini FAB</div>
  <div class="example-button-row">
    <div class="example-flex-container">
      <button aria-label="Example icon button with a menu icon" matMiniFab type="button">
        <mat-icon class="material-symbols-rounded">menu</mat-icon>
      </button>
      <button aria-label="Example icon button with a home icon" disabled matMiniFab type="button">
        <mat-icon class="material-symbols-rounded">home</mat-icon>
      </button>
    </div>
  </div>
</section>
<mat-divider />
<section>
  <div class="example-label">Extended FAB</div>
  <div class="example-button-row">
    <div class="example-flex-container">
      <button extended matFab type="button">
        <mat-icon class="material-symbols-rounded">favorite</mat-icon>
        Basic
      </button>
      <button disabled extended matFab type="button">
        <mat-icon class="material-symbols-rounded">favorite</mat-icon>
        Disabled
      </button>
      <a extended matFab routerLink=".">
        <mat-icon class="material-symbols-rounded">favorite</mat-icon>
        Link
      </a>
    </div>
  </div>
</section>
