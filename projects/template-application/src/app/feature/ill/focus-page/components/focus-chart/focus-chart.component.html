<app-chart-card class="card" [showNavigator]="true" [resetDisabled]="store.atFullRange()" (reset)="store.setWindow(null)">
  <div chartToolbar class="toolbar">
    <h2 class="title">
      @if (store.focused(); as scan) {
        <span class="dot" [style.background]="color(scan.colorIndex)"></span>
        {{ label(scan.datetime) }}
        @if (scan.reference) {
          <span class="app-tag">Reference</span>
        }
      } @else {
        All scans
      }
    </h2>
    <div class="actions">
      <button
        mat-button
        type="button"
        cdkOverlayOrigin
        #legendOrigin="cdkOverlayOrigin"
        [attr.aria-expanded]="store.legendOpen()"
        (click)="store.legendOpen.set(!store.legendOpen())"
      >
        Open legend
      </button>
      <mat-slide-toggle class="fit-y" labelPosition="before" hideIcon [checked]="store.fitY()" (change)="store.fitY.set($event.checked)">
        Fit Y
      </mat-slide-toggle>
      <span class="app-divider-vertical"></span>
      <button mat-button type="button" (click)="exportImage()">Export graph</button>
    </div>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="legendOrigin"
    [cdkConnectedOverlayOpen]="store.legendOpen()"
    [cdkConnectedOverlayPositions]="positions"
    (overlayKeydown)="onKey($event)"
  >
    <!-- A floating panel, not a modal popover: no backdrop, so the chart stays usable while it's open. Drag it by its header; × or Escape closes it. -->
    <section
      class="app-popover legend-panel"
      role="dialog"
      aria-label="Legend"
      cdkDrag
      cdkDragBoundary=".cdk-overlay-container"
      [cdkDragFreeDragPosition]="legendPosition()"
      (cdkDragEnded)="legendPosition.set($event.source.getFreeDragPosition())"
    >
      <div class="legend-panel__head" cdkDragHandle>
        <mat-icon class="legend-panel__grip" aria-hidden="true">drag_indicator</mat-icon>
        <h3 class="legend-panel__title">Legend</h3>
        <button mat-icon-button type="button" aria-label="Close legend" cdkFocusInitial (click)="store.legendOpen.set(false)">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <app-scans-legend class="legend" />
    </section>
  </ng-template>

  <div
    class="chart"
    echarts
    [options]="options()"
    [merge]="windowMerge()"
    [theme]="chartTheme.theme()"
    [loading]="store.loading() || store.busy()"
    [loadingOpts]="loadingOpts()"
    (chartInit)="onChartInit($event)"
    (chartDataZoom)="onZoom($event)"
  ></div>

  <app-chart-navigator
    chartNavigator
    [series]="navigatorSeries()"
    [xMin]="min"
    [xMax]="max"
    [inverse]="true"
    [window]="store.window()"
    (windowChange)="store.setWindow($event)"
  />
</app-chart-card>
