@if (breadcrumbs$ | async; as crumbs) {
  @if (crumbs.length > 0) {
    <nav aria-label="Breadcrumb">
      <ol>
        @for (crumb of crumbs; track crumb.route; let last = $last) {
          <li [attr.aria-current]="last ? 'page' : null">
            @if (!last) {
              <a [routerLink]="crumb.route">{{ crumb.label }}</a>
              <mat-icon aria-hidden="true" class="separator">chevron_right</mat-icon>
            } @else {
              <span>{{ crumb.label }}</span>
            }
          </li>
        }
      </ol>
    </nav>
  }
}
