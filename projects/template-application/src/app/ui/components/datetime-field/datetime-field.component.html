<mat-form-field appearance="outline" class="datetime-field__date" subscriptSizing="dynamic">
  <input
    matInput
    [attr.aria-label]="label() + ' date'"
    [disabled]="isDisabled()"
    [matDatepicker]="dp"
    [value]="value()"
    (blur)="onTouched()"
    (dateChange)="onDateChange($event)"
  />
  <mat-datepicker-toggle matSuffix [for]="dp" />
  <mat-datepicker #dp />
</mat-form-field>
<mat-form-field appearance="outline" class="datetime-field__time" subscriptSizing="dynamic">
  <input
    matInput
    step="1"
    type="time"
    [attr.aria-label]="label() + ' time'"
    [disabled]="isDisabled()"
    [value]="timeString()"
    (blur)="onTouched()"
    (change)="onTimeChange($event)"
  />
</mat-form-field>
