<span
  class="lozenge-spinner"
  [attr.data-testid]="testId() || null"
  [class.lozenge-spinner--xsmall]="size() === 'xsmall'"
>
  <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <circle
      cx="12"
      cy="12"
      fill="none"
      r="9"
      stroke="currentColor"
      stroke-dasharray="40 60"
      stroke-linecap="round"
      stroke-width="2.5"
    />
  </svg>
  <span class="lozenge-spinner__sr-only">{{ label() }}</span>
</span>
